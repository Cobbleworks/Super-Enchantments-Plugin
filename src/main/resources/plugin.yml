name: SuperEnchantments
version: ${project.version}
main: org.example.SuperEnchantments
api-version: 1.13
author: Cobbleworks
website: https://github.com/Cobbleworks/Super-Enchantments-Plugin
commands:
  superenchant:
    description: Add enchantments above normal maximum and custom enchantments
    usage: /superenchant <Enchantment> <Level>
    aliases: [senchant, se]
    permission: superenchantments.use
  enchantlist:
    description: Shows all available enchantments for the current item
    usage: /enchantlist
    aliases: [elist, el]
    permission: superenchantments.list
permissions:
  superenchantments.use:
    description: Allows using super enchantments and custom enchantments
    default: op
  superenchantments.list:
    description: Allows viewing available enchantments
    default: true
